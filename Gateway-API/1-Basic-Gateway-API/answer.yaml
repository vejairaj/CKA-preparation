#    Create a GatewayClass named nginx-gateway-class.


apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: nginx-gateway-class
spec:
  controllerName: example.com/gateway-controller

---
#  Create a Gateway named web-gateway.
##The Gateway must:
#    #use nginx-gateway-class
#    #listen for HTTP traffic
#    #listen on port 80
#    #use hostname web.example.com


apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gateway
spec:
  gatewayClassName: nginx-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "www.example.com"
      allowedRoutes:
        namespaces:
          from: Same
---
#Create an HTTPRoute named web-route.
#The HTTPRoute must:
    # attach to web-gateway
    # accept requests for web.example.com
    # route / traffic to web-svc on port 80.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-route
spec:
  parentRefs:
    - name: web-gateway
  hostnames:
    - "www.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web-svc
          port: 80